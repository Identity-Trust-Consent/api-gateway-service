server:
  port: 8080

spring:
  application:
    name: api-gateway-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:10.212.13.208}:${DB_PORT:5432}/${DB_NAME:identity}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Welcome@123}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/identity-os}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI:http://localhost:8085/realms/identity-os}/protocol/openid-connect/certs}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: onboarding-service
              uri: ${ONBOARDING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/onboarding/**,/api/v1/integration/**,/.well-known/identity-os-configuration

            - id: authentication-service
              uri: ${AUTHENTICATION_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/organization/**

            - id: policy-governance-service
              uri: ${POLICY_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/policy/**
